name: Integrate Debian Trixie with tavashtr branch

on:
  workflow_dispatch:
    inputs:
      resolution_ref:
        description: 'Branch containing a manual resolution merge commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: integrate-debian-trixie
  cancel-in-progress: false

jobs:
  integrate:
    if: github.ref == 'refs/heads/tavashtr' || github.ref == 'refs/heads/debian-trixie'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out Tavashtr integration code
        uses: actions/checkout@v7
        with:
          ref: tavashtr
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Debian tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends dpkg-dev debian-archive-keyring

      - name: Prepare integration branch
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch origin tavashtr debian-trixie

          if git merge-base --is-ancestor origin/debian-trixie origin/tavashtr; then
            echo "Tavashtr already contains the Debian Trixie snapshot."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/changelogs"
          git show origin/tavashtr:debian/changelog \
            > "$RUNNER_TEMP/changelogs/tavashtr"
          git show origin/debian-trixie:debian/changelog \
            > "$RUNNER_TEMP/changelogs/debian-trixie"

          debian_version="$(
            dpkg-parsechangelog \
              --file "$RUNNER_TEMP/changelogs/debian-trixie" \
              --show-field Version
          )"
          branch="integration/debian-trixie-${debian_version//[:~]/_}"

          existing_pr="$(
            gh pr list \
              --state open \
              --base tavashtr \
              --head "$branch" \
              --json url \
              --jq '.[0].url // empty'
          )"
          if [[ -n "$existing_pr" ]]; then
            echo "An integration PR already exists: $existing_pr"
            exit 0
          fi

          git switch --create "$branch" origin/tavashtr
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Look up Debian binary versions
        if: steps.prepare.outputs.branch != ''
        shell: bash
        env:
          TARGET_ARCH: amd64
        run: |
          set -euo pipefail
          changelog="$RUNNER_TEMP/changelogs/debian-trixie"
          source_package=$(dpkg-parsechangelog --file "$changelog" --show-field Source)
          source_version=$(dpkg-parsechangelog --file "$changelog" --show-field Version)

          bash .github/scripts/lookup-debian-binaries.sh \
            "$source_package" "$source_version" "$TARGET_ARCH" \
            > "$RUNNER_TEMP/debian-binaries.tsv"
          cat "$RUNNER_TEMP/debian-binaries.tsv"

      - name: Merge Debian source and resolve changelog
        if: steps.prepare.outputs.branch != ''
        shell: bash
        env:
          RESOLUTION_REF: ${{ inputs.resolution_ref }}
        run: |
          set -euo pipefail
          git config user.name "Tavashtr Integration Bot"
          git config user.email "githubci@tavashtr.com"

          resolved_changelog="$RUNNER_TEMP/resolved-changelog"
          ./.github/scripts/resolve-merge-tavashtr-changelog.sh \
            "$RUNNER_TEMP/changelogs/tavashtr" \
            "$RUNNER_TEMP/changelogs/debian-trixie" \
            "$resolved_changelog" \
            "$RUNNER_TEMP/debian-binaries.tsv"

          if ! git merge --no-ff --no-commit origin/debian-trixie; then
            debian_commit=$(git rev-parse --verify MERGE_HEAD)
            conflicts=$(git diff --name-only --diff-filter=U)
            [[ -n "$conflicts" ]] || exit 1

            if [[ "$conflicts" != debian/changelog ]]; then
              if [[ -z "$RESOLUTION_REF" ]]; then
                echo '::error::Manual resolution required. Push the branch containing your manual resolution merge commit, then enter its name in resolution_ref.'
                printf '%s\n' "$conflicts"
                exit 1
              fi

              resolution_branch="refs/heads/$RESOLUTION_REF"
              git check-ref-format "$resolution_branch"
              git fetch --no-tags --refmap= origin "$resolution_branch"
              resolution_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
              tavashtr_commit=$(git rev-parse HEAD)

              if [[ $(git show -s --format=%P "$resolution_commit") != "$tavashtr_commit $debian_commit" ]]; then
                echo '::error::Recreate the manual resolution merge from the current Tavashtr and Debian branch tips.'
                exit 1
              fi

              if ! git diff --quiet HEAD "$resolution_commit" -- debian/changelog; then
                echo '::error::Keep the Tavashtr branch changelog in the manual resolution merge.'
                exit 1
              fi

              git read-tree --reset -u "$resolution_commit"
            fi
          fi

          git rev-parse --verify MERGE_HEAD >/dev/null
          install -m 0644 "$resolved_changelog" debian/changelog
          git add -- debian/changelog
          git commit --no-edit

      - name: Push integration branch and open PR
        if: steps.prepare.outputs.branch != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INTEGRATION_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          git push origin "$INTEGRATION_BRANCH"
          gh pr create \
            --base tavashtr \
            --head "$INTEGRATION_BRANCH" \
            --title "Integrate Debian Trixie into Tavashtr" \
            --body "Integrates debian-trixie into tavashtr. The Debian package build must pass before merging."
